schema: spec-driven

context: |
  Language: Chinese
  All artifacts must be written in Chinese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## 项目背景
  本仓库是参加两项比赛的项目管理仓库（非代码仓库），题目于 2026-09-18 20:00 开放：
  - 比赛 A：https://dptechnology.feishu.cn/wiki/N9STwPrFEiDLXbkSGZxcp4mFn2e
  - 比赛 B：https://dptechnology.feishu.cn/wiki/Pda8wY9NFiXS7xkN75qcESzXnvU

  ## 工具链约定
  - Bohrium 资源管理（文件 / 数据集 / 任务 / 节点）：使用 bohr CLI
  - 数据集下载：使用 wenyon（wenyon-cli）
  - 算力资源：使用 trisol 的 arena team（team 待管理员审批，审批前不要阻塞其他工作）

  ## 比赛规则要点（详见 docs/比赛规则说明.md）
  - 两项比赛均不进行轨迹评分，最终排名完全按任务本体分数，评分规则以题面为准
  - 可自由组合 Multi-Agent / Sub-Agent 等任意 Agent 架构
  - 轨迹上传主站 500KB 限制只卡非文件字段：trace 以文件形式（带 filename）上传即可绕过
  - 红线：不得向比赛算力池提交非比赛任务

  ## 协作约定
  - 本仓库是团队的单一事实来源，所有计划、规格、变更都通过 git 共享
  - 数据集、模型权重等大文件不入库，只在规格中记录来源与获取方式

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
